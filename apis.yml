aid: california-privacy-protection-agency
name: California Privacy Protection Agency
description: >-
  The California Privacy Protection Agency (CPPA, branded CalPrivacy) is the state regulator that
  administers and enforces the California Consumer Privacy Act and the Delete Act. Under the Delete
  Act it operates DROP, the Delete Request and Opt-out Platform, through which California residents
  file a single deletion request that every registered data broker must process at least once every
  45 days beginning August 1, 2026. Data brokers integrate with DROP through the DROP Data Broker
  API, a three-operation REST surface on api.drop.privacy.ca.gov (download hashed consumer deletion
  lists as a ZIP of CSVs, upload Id,Status response files, amend prior responses) authenticated with
  an X-API-KEY issued in the Data Broker Portal, with a sandbox environment, HMAC-SHA256 signed
  webhook notifications, and an OpenAPI 3.1.0 contract published alongside the technical
  specifications on privacy.ca.gov. The agency also publishes the California Data Broker Registry as
  downloadable CSV files.
