note: >-
  CalPrivacy publishes no numeric rate limit for the DROP Data Broker API. The API operations page
  and the OpenAPI document the exhaustion signal only: HTTP 429 Too Many Requests with a Retry-After
  header (integer seconds, example 30) and the guidance "Wait 30 seconds and retry". No
  X-RateLimit-* or RateLimit-* headers are documented. The 202 on GET /data/download also carries a
  Retry-After (example 60) that tells the caller when to poll again while the ZIP is being prepared.
  Separately, the statutory cadence is a floor rather than a ceiling: brokers must access DROP at
  least once every 45 calendar days and may download more often.
