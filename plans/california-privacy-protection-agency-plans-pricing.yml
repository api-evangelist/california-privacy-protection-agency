note: >-
  DROP is not a commercial API; access is a legal obligation under the Delete Act (Cal. Civ. Code
  1798.99.80 et seq.). The "plans" are the statutory fees a data broker must pay inside DROP (by
  credit card) before an API key can be issued. There is no free tier, no usage metering and no
  per-call pricing; the API itself carries no charge beyond these fees. Non-compliance penalties
  are recorded for completeness because they are the only other published dollar figures.
plans:
